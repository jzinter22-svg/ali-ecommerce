<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر علي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-content">
      <div class="logo">متجر علي</div>

      <nav class="main-nav">
        <ul>
          <li><a href="#">الرئيسية</a></li>
          <li><a href="#">المنتجات</a></li>
          <li><a href="#">الأقسام</a></li>
          <li><a href="#" id="orders-toggle">طلباتي</a></li>
          <li><a href="#" id="cart-toggle">سلة التسوق <span id="cart-count" class="cart-count">0</span></a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-content">
        <h1>أهلاً بك في متجر علي</h1>
        <p>وجهتك الأولى للتسوق بسهولة وأسعار مناسبة لجميع احتياجاتك.</p>
        <button class="btn-primary">تصفح المنتجات</button>
      </div>
    </section>

    <section class="products" id="products">
      <div class="container">
        <h2 class="section-title">منتجاتنا</h2>

        <div class="product-filters">
          <input type="text" id="product-search" class="search-input" placeholder="ابحث عن منتج...">
          <select id="category-filter" class="category-select">
            <option value="all">كل الفئات</option>
          </select>
          <select id="sort-products" class="category-select">
            <option value="default">الترتيب الافتراضي</option>
            <option value="price-asc">السعر: من الأقل إلى الأعلى</option>
            <option value="price-desc">السعر: من الأعلى إلى الأقل</option>
            <option value="name-asc">الاسم: أ - ي</option>
          </select>
          <button type="button" id="reset-filters" class="btn-reset-filters">إعادة تعيين</button>
        </div>

        <div class="products-grid" id="products-container"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; متجر علي</p>
    </div>
  </footer>

  <div class="cart-overlay" id="cart-overlay" hidden>
    <div class="cart-panel">
      <div class="cart-panel-header">
        <h2>سلة التسوق</h2>
        <button class="btn-close-cart" id="close-cart" aria-label="إغلاق السلة">×</button>
      </div>
      <div class="cart-items" id="cart-items"></div>
      <div class="cart-footer">
        <p class="cart-total">الإجمالي: <span id="cart-total-amount">0</span> د.ع</p>
        <button class="btn-checkout" id="checkout-btn">إتمام الطلب</button>
        <button class="btn-clear-cart" id="clear-cart">إفراغ السلة</button>
      </div>
    </div>
  </div>

  <div class="checkout-overlay" id="checkout-overlay" hidden>
    <div class="cart-panel checkout-panel">
      <div class="cart-panel-header">
        <h2>إتمام الطلب</h2>
        <button class="btn-close-cart" id="close-checkout" aria-label="إغلاق نافذة الطلب">×</button>
      </div>
      <div class="checkout-body" id="checkout-body"></div>
    </div>
  </div>

  <div class="product-details-overlay" id="product-details-overlay" hidden>
    <div class="cart-panel product-details-panel">
      <div class="cart-panel-header">
        <h2>تفاصيل المنتج</h2>
        <button class="btn-close-cart" id="close-product-details" aria-label="إغلاق تفاصيل المنتج">×</button>
      </div>
      <div class="product-details-body" id="product-details-body"></div>
    </div>
  </div>

  <div class="orders-overlay" id="orders-overlay" hidden>
    <div class="cart-panel orders-panel">
      <div class="cart-panel-header">
        <h2 id="orders-panel-title">طلباتي السابقة</h2>
        <button class="btn-close-cart" id="close-orders" aria-label="إغلاق طلباتي">×</button>
      </div>
      <div class="orders-body" id="orders-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
